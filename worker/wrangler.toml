# Hosted MCP endpoint. Deploy from the VPS:
#   cd worker && CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN_WORKERS \
#     ../../thegoldbarometer/site/node_modules/.bin/wrangler deploy
name = "tgb-mcp"
main = "../src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mcp.thegoldbarometer.com/*", zone_name = "thegoldbarometer.com" }
]

# 60 requests per minute per client IP (Workers rate-limiting binding).
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
