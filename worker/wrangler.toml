# Hosted MCP endpoint. Deploy from the VPS:
#   cd worker && CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN_WORKERS \
#     ../../thegoldbarometer/site/node_modules/.bin/wrangler deploy
name = "tgb-mcp"
main = "../src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mcp.thegoldbarometer.com/*", zone_name = "thegoldbarometer.com" }
]

# Rate limiting is a zone WAF rule (Security > WAF > Rate limiting rules:
# hostname mcp.thegoldbarometer.com, path /mcp, per IP), not a Worker
# binding: the Workers rate-limit binding was measured on 2026-09-18 to
# keep its counter per request only (61 allowed inside one request, a
# fresh 61 for the next one), so it never limits real traffic. The code in
# worker.ts still honours an `RL` binding if one is ever added here.
