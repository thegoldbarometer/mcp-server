name: Publish to MCP registry
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -o 'https://[^"]*publisher_linux_amd64.tar.gz' | head -1)" -o p.tgz
          tar xzf p.tgz
      - name: Login with OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
